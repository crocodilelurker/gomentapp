# Only the api-gateway is published to the host.
# Every other service is reachable only inside this compose network, by service name
# (e.g. http://policy-scheme-service:8000), and the gateway routes to them via
# api-gateway/src/constants/routes.js.

services:
  api-gateway:
    build: ./api-gateway
    env_file: .env
    ports:
      - "${GATEWAY_HOST_PORT:-8000}:8000"
    depends_on:
      policy-scheme-service:
        condition: service_healthy
      rag-service:
        condition: service_healthy
    restart: unless-stopped

  policy-scheme-service:
    build: ./policy-scheme-service
    env_file:
      - .env
      - ./policy-scheme-service/.env
    environment:
      # The service speaks plain S3; locally its credentials are MinIO's root user.
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    expose:
      - "8000"
    volumes:
      - policy-catalog-data:/app/data    # SQLite metadata catalog
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  rag-service:
    build: ./rag-service
    env_file:
      - .env
      - ./rag-service/.env
    expose:
      - "8000"
    volumes:
      - rag-chroma-data:/app/data    # ChromaDB index survives restarts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  minio:
    # Official minio/minio images are no longer published; pgsty/minio is a maintained community build.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    expose:
      - "9000"    # S3 API
      - "9001"    # web console (internal only)
    volumes:
      - minio-data:/data    # raw/ and parsed/ policy files
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  rag-chroma-data:
  policy-catalog-data:
  minio-data:
